<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <!-- 화이트 스킨(뉴모피즘)용 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

  <style>
    /* ===== 화이트 스킨 (뉴모피즘) 디자인 토큰 ===== */
    :root {
      --bg: #e0e5ec;
      --sh-dark: #a3b1c6;
      --sh-light: #ffffff;
      --text-main: #4a5568;
      --text-muted: #8593a8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --nm-raised: 6px 6px 13px var(--sh-dark), -6px -6px 13px var(--sh-light);
      --nm-raised-sm: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      --nm-inset: inset 5px 5px 10px var(--sh-dark), inset -5px -5px 10px var(--sh-light);
      --nm-inset-sm: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
    }

    * {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      font-size: 16px;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      background: var(--bg);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      box-sizing: border-box;
    }

    /* 카메라 박스 — 뉴모피즘 인셋 프레임 */
    #interactive {
      position: relative;
      width: 64%;        /* 가로 확대 */
      height: 150px;
      max-width: 95%;
      margin: 4px auto 0;
      display: block;
      overflow: hidden;
      border-radius: 18px;
      background: var(--bg);
      box-shadow: var(--nm-inset);
      box-sizing: border-box;
    }

    #interactive video,
    #interactive canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    canvas.drawing,
    canvas.drawingBuffer {
      position: absolute;
      top: 0;
      left: 0;
    }

    #resultBox {
      width: 92%;
      text-align: center;
      margin: 12px auto 0;
      box-sizing: border-box;
      position: relative;   /* 버전 라벨 절대배치 기준 */
    }

    /* 바코드 표시 입력 — 인셋 */
    #barcodeInput {
      width: 90%;
      height: 46px;
      font-size: 16px;
      padding: 6px 14px;
      box-sizing: border-box;
      border: none;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text-main);
      box-shadow: var(--nm-inset-sm);
      text-align: center;
    }

    /* 카메라 버튼 — 뉴모피즘 raised */
    #resultBox input[type="button"] {
      width: 64%;
      margin: 10px auto;
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: var(--bg);
      color: var(--primary);
      box-shadow: var(--nm-raised-sm);
      cursor: pointer;
    }

    #resultBox input[type="button"]:active {
      box-shadow: var(--nm-inset-sm);
    }

    #msgDiv {
      font-size: 30px;
      padding: 5px;
      box-sizing: border-box;
    }

    .container-fluid {
      max-width: 100%;
      padding: 0 5px;
      zoom: 0.9;          /* 화면 본문만 약 10% 축소 (모달은 제외 → 팝업 정중앙 유지) */
    }

    /* 검색 입력칸 — 인셋 */
    #searchCode,
    #searchInput {
      border: none !important;
      border-radius: 12px !important;
      background: var(--bg) !important;
      color: var(--text-main) !important;
      box-shadow: var(--nm-inset-sm) !important;
    }

    /* 검색 버튼 */
    form .btn-outline-secondary {
      border: none;
      border-radius: 12px;
      background: var(--bg);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--nm-raised-sm);
    }

    form .btn-outline-secondary:active {
      box-shadow: var(--nm-inset-sm);
    }

    /* 자동완성 드롭다운 */
    #autocomplete-list {
      border: none !important;
      border-radius: 12px !important;
      background: var(--bg) !important;
      box-shadow: var(--nm-raised) !important;
    }

    #autocomplete-list .list-group-item {
      background: transparent;
      border: none;
      color: var(--text-main);
    }

    /* 저장 진행바 */
    .progress {
      background: var(--bg) !important;
      border-radius: 99px !important;
      box-shadow: var(--nm-inset-sm);
    }

    .progress-bar {
      background-color: var(--primary) !important;
    }

    /* 담당자 모달 — 뉴모피즘 카드 */
    #managerModal {
      z-index: 9999;
    }

    #managerModal .modal-content {
      border: none;
      border-radius: 22px;
      background: var(--bg);
      box-shadow: var(--nm-raised);
    }

    #managerModal .modal-header {
      background: transparent !important;
      color: var(--text-main) !important;
      border-bottom: 1px solid rgba(163, 177, 198, 0.3);
    }

    .manager-select-btn {
      font-size: 1.2rem;
      font-weight: 600;
      padding: 15px 20px;
      margin: 8px 0;
      width: 100%;
      text-align: center;
      border: none !important;
      border-radius: 14px !important;
      background: var(--bg) !important;
      color: var(--primary) !important;
      box-shadow: var(--nm-raised-sm) !important;
    }

    .manager-select-btn:active {
      box-shadow: var(--nm-inset-sm) !important;
    }

    /* 중앙 확인 팝업 — 뉴모피즘 카드 */
    #confirmModal .modal-content {
      border: none;
      border-radius: 24px;
      background: var(--bg);
      box-shadow: var(--nm-raised);
      padding: 6px 4px;
    }

    #confirmModal .confirm-icon {
      width: 62px;
      height: 62px;
      margin: 6px auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      background: var(--bg);
      box-shadow: var(--nm-raised-sm);
    }

    #confirmModal .confirm-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    #confirmModal .confirm-body {
      font-size: 1.02rem;
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    #confirmModal .confirm-btn {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 13px 0;
      border: none;
      border-radius: 14px;
      background: var(--bg);
      box-shadow: var(--nm-raised-sm);
    }

    #confirmModal .confirm-btn:active {
      box-shadow: var(--nm-inset-sm);
    }

    #confirmModal .confirm-btn.ok {
      color: #fff;
      background: var(--primary);
    }

    #confirmModal .confirm-btn.cancel {
      color: var(--text-muted);
    }

    /* 결과 테이블 — 뉴모피즘 카드 */
    table.table {
      background: var(--bg);
      border-radius: 18px;
      box-shadow: var(--nm-raised);
      overflow: hidden;
      border: none !important;
      margin-top: 6px;
    }

    table.table thead th {
      white-space: nowrap;
      font-size: 0.58rem;
      padding: 8px 2px;
      vertical-align: middle;
      background: transparent;
      color: var(--text-muted);
      border: none !important;
      border-bottom: 2px solid rgba(163, 177, 198, 0.35) !important;
      font-weight: 700;
    }

    table.table tbody td {
      white-space: nowrap;
      font-size: 0.58rem;
      padding: 6px 2px;
      vertical-align: middle;
      background: transparent;
      color: var(--text-main);
      border: none !important;
      border-bottom: 1px solid rgba(130, 145, 170, 0.5) !important;
    }

    /* 반 ~ 종료일시: 한 포인트 크게 + 볼드 */
    table.table tbody td.ban,
    table.table tbody td.qtum,
    table.table tbody td.walkTime,
    table.table tbody td.endTime {
      font-weight: 700;
    }

    table.table tbody td.ban {
      font-size: 0.66rem;
    }

    table.table tbody td.walkTime,
    table.table tbody td.endTime {
      font-size: 0.58rem;
    }

    table.table tbody td.qtum {
      white-space: normal;     /* 퀀텀관 등만 줄바꿈 허용 */
      word-break: keep-all;
      font-size: 0.63rem;
    }

    table.table tbody .sID {
      font-size: 0.55rem;
      color: var(--primary);
    }

    table.table tbody .student {
      font-size: 0.62rem;
      color: var(--text-main);
    }

    /* 산책허용시간 초과(진행중이거나 늦게 복귀)한 학생 이름 강조 */
    /* .text-primary(부트스트랩)가 !important로 색을 강제하므로 여기서도 !important 필요 */
    table.table tbody .student.over {
      color: #c0392b !important;
      font-weight: 700;
    }

    /* 산책중/종료 버튼 — 부드러운 모양 (상태색은 유지) */
    table.table td.actionBtn button {
      font-size: 0.55rem;
      font-weight: 600;
      padding: 5px 8px;
      border: none;
      border-radius: 10px;
      box-shadow: var(--nm-raised-sm);
    }

    table.table td.actionBtn button:active {
      box-shadow: var(--nm-inset-sm);
    }

    /* 시간 초과 표시 — 채도 낮춘 부드러운 로즈레드, 둥근 배지 */
    .walk-dt.over {
      display: inline-block;
      background: #d98a92;       /* 채도 낮춘 로즈레드 */
      color: #fff;
      border-radius: 8px;
      padding: 2px 8px;
    }

    /* '분 경과' 빨강도 톤다운 */
    table.table .text-danger {
      color: #c77784 !important;
    }
  </style>
  <title>바코드_walk (버셀)</title>
</head>

<body>
  <!-- 담당자 선택 모달 -->
  <div class="modal fade" id="managerModal" tabindex="-1" aria-labelledby="managerModalLabel" aria-hidden="true"
    data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="managerModalLabel">담당자 선택</h5>
        </div>
        <div class="modal-body">
          <p class="mb-3" style="font-size: 1.1rem;">작업할 담당자를 선택해주세요.</p>
          <div id="managerList" class="d-grid gap-2">
            <!-- 담당자 목록이 동적으로 추가됨 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 중앙 확인 팝업 (산책 등록 / 종료 확인) -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true"
    data-bs-backdrop="static" data-bs-keyboard="false" style="z-index: 10000;">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 340px;">
      <div class="modal-content">
        <div class="modal-body text-center px-4 pt-4 pb-3">
          <div class="confirm-icon" id="confirmModalIcon">🚶</div>
          <div class="confirm-title" id="confirmModalLabel">확인</div>
          <div class="confirm-body" id="confirmModalBody">진행할까요?</div>
          <div class="d-flex gap-2">
            <button type="button" class="confirm-btn cancel" onclick="confirmCancel()">취소</button>
            <button type="button" class="confirm-btn ok" onclick="confirmOk()">확인</button>
          </div>

  <div class="container-fluid p-0">
    <div id="interactive" class="viewport"></div>

    <div id="resultBox">
      <input type="text" id="barcodeInput" placeholder="스캔된 바코드가 여기에 표시됩니다" readonly>
      <input type="button" value="카메라 활성화" id="startScanner" onclick="startScanner()" style="display:block;">
      <span id="verLabel" style="position:absolute; top:2px; right:6px; font-size:0.62rem; color:var(--text-muted);">ver.2607011</span>
      <input type="button" value="카메라 중지" id="stopScanner" onclick="stopScanner()" style="display:none;">
    </div>
    <br>

    <!-- 검색 폼 + 자동완성 (기존 search.html 인라인) -->
    <form class="row g-3 w-100" onsubmit="return false;">
      <div class="col-5 position-relative mb-2">
        <input type="text" class="form-control" maxlength="8" oninput="maxLengthCheck(this)" id="searchCode"
          name="searchCode" style="background-color:rgb(250, 171, 171); font-size:100%; width:100%; max-width: 180px;"
          onfocus="this.value=''" onkeyup="if(event.keyCode==13){search()}" autocomplete="off" />
        <div id="autocomplete-list" class="list-group position-absolute"
          style="z-index: 1050; display: none; max-height: 250px; overflow-y: auto; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); font-size: 16px; background-color: #fff;">
        </div>
      </div>
      <div class="col-5 mb-2">
        <input type="text" class="form-control" id="searchInput" disabled placeholder="학생증을 스캔하세요.">
      </div>
      <div class="col-2 mb-2">
        <button class="btn btn-outline-secondary" type="button" onclick="search()">검색</button>
      </div>
      <div class="mb-2 w-100">
        <center><b id="tblMessage" style="color:red"></b></center>
      </div>
    </form>

    <!-- 저장 진행 표시 (구글시트 저장 동안 노출) -->
    <div id="saveProgress" class="w-100 px-2 mb-2" style="display:none;">
      <div class="text-center mb-1" style="color:#0d6efd; font-weight:bold; font-size:0.8rem;">⏳ 구글시트에 저장 중...</div>
      <div class="progress" style="height: 12px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width:100%"></div>
      </div>
    </div>

    <!-- 현재 산책중 인원 카운트 -->
    <div class="px-2 mb-1" style="text-align:left;">
      <span id="walkingCount" style="font-weight:700; color:var(--primary); font-size:0.9rem;">산책중 : 0명</span>
    </div>

    <table class="table table-bordered border-primary form-control-sm text-center align-middle">
      <thead class="table-light border-primary" style="border-bottom: 2px solid #0d6efd;">
        <tr class="border-primary">
          <th scope="col" class="border-primary" style="white-space: nowrap; width: 60px;">학생</th>
          <th scope="col" class="border-primary">반</th>
          <th scope="col" class="border-primary">퀀텀관 등</th>
          <th scope="col" class="border-primary">walk(스캔일시)</th>
          <th scope="col" class="border-primary">종료일시</th>
          <th scope="col" class="border-primary" style="white-space: nowrap; width: 95px;">산책종료</th>
        </tr>
      </thead>
      <tbody id="searchResults"></tbody>
    </table>
    <div id="msgDiv"></div>
  </div>

  <template id="rowtemplate">
    <tr>
      <td class="studentInfo text-center p-1" style="line-height: 1.1; white-space: nowrap;">
        <div class="sID fw-bold text-danger" style="font-size: 0.65rem; margin-bottom: 1px;"></div>
        <div class="student fw-bold text-primary" style="font-size: 0.75rem;"></div>
      </td>
      <td class="ban"></td>
      <td class="qtum"></td>
      <td class="walkTime fw-bold"></td>
      <td class="endTime fw-bold text-success"></td>
      <td class="actionBtn p-1" style="white-space: nowrap;">
        <button class="btn btn-sm btn-success endWalkBtn" style="white-space: nowrap;">산책중</button>
      </td>
    </tr>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <script>
    // ===== 설정: 본인 GAS 웹앱 주소로 교체하세요 =====
    // 예: https://script.google.com/macros/s/AKfycb..../exec
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwqs5uxS3NKhki8jgJ7o8Uf0t4CLHjmLtil_t13mQIfzlUSDiT84yYKAorNCTqQgwVWLw/exec";

    // ===== JSONP 헬퍼: 모든 서버호출을 이걸로 통일 (CORS 우회) =====
    let gasCallSeq = 0;
    function gasCall(action, payload) {
      return new Promise(function (resolve, reject) {
        const cbName = "gas_cb_" + (gasCallSeq++);
        const script = document.createElement("script");
        let done = false;

        function cleanup() {
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function (data) {
          done = true;
          cleanup();
          resolve(data);
        };

        let src = GAS_API_URL + "?action=" + encodeURIComponent(action) + "&callback=" + cbName;
        if (payload) {
          src += "&payload=" + encodeURIComponent(JSON.stringify(payload));
        }
        script.onerror = function () {
          if (!done) { cleanup(); reject(new Error("서버 호출 실패: " + action)); }
        };
        script.src = src;
        document.body.appendChild(script);
      });
    }

    // ===== 전역 상태 =====
    var data = [];                 // 학생 마스터
    var chk_old = 0;               // 직전 스캔 코드 (10초 중복 방지)
    var lastScannedTimeChk = 0;
    var selectedManager = "";      // 선택된 담당자
    var walkTimeoutMinutes = 10;
    var WALK_LIMIT = 15;           // 동시 산책중 최대 인원
    var confirmOpen = false;       // 중앙 확인 팝업이 떠 있는 동안 스캔 중첩 방지
    var pendingEnds = {};          // 방금 종료 처리한 행(서버 반영 전) 보호용: key→종료시간
    var recentWalkInterval = null;
    var timeCheckInterval = null;

    function maxLengthCheck(object) {
      if (object.value.length > object.maxLength) {
        object.value = object.value.slice(0, object.maxLength);
      }
    }

    // 저장 진행바 표시/숨김
    function showSaveProgress() {
      var el = document.getElementById('saveProgress');
      if (el) el.style.display = 'block';
    }
    function hideSaveProgress() {
      var el = document.getElementById('saveProgress');
      if (el) el.style.display = 'none';
    }

    // 오늘 날짜 문자열 (YYYY-MM-DD)
    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' +
        ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
        ('0' + d.getDate()).slice(-2);
    }

    // 해당 기록이 '오늘'인지 판별 (날짜가 바뀌면 전일 데이터 제외)
    function isToday(walkTimeStr) {
      if (!walkTimeStr) return false;
      var s = String(walkTimeStr).trim();
      if (s.slice(0, 10) === todayStr()) return true; // "YYYY-MM-DD..." 우선 비교
      var d = new Date(s.replace(' ', 'T'));           // 다른 형식 대비 파싱
      if (isNaN(d.getTime())) return false;
      var now = new Date();
      return d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate();
    }

    // walk 셀: 윗줄 일시 + 아랫줄 등록자명(담당자)
    function setWalkCell(cellEl, dateTimeStr, managerName) {
      if (!cellEl) return;
      cellEl.innerHTML = '';
      var t = document.createElement('div');
      t.className = 'walk-dt';
      t.textContent = dateTimeStr || '';
      var m = document.createElement('div');
      m.textContent = managerName || '';
      m.style.fontWeight = 'normal';
      m.style.fontSize = '0.85em';
      m.style.color = '#555';
      cellEl.appendChild(t);
      cellEl.appendChild(m);
    }

    // ===== 담당자 선택 =====
    function selectManager(managerName) {
      selectedManager = managerName;
      const modal = bootstrap.Modal.getInstance(document.getElementById('managerModal'));
      if (modal) modal.hide();
      document.getElementById('barcodeInput').style.display = 'none';
      startScanner();
    }

    function loadManagerList() {
      gasCall('getManagerList').then(function (managers) {
        const div = document.getElementById('managerList');
        div.innerHTML = '';

        if (!managers || managers.length === 0) {
          div.innerHTML = '<p class="text-danger">담당자 목록이 없습니다. wakeup담당자 시트를 확인해주세요.</p>';
          setTimeout(function () { selectManager(""); }, 2000);
          return;
        }

        managers.forEach(function (m) {

          '<p class="text-danger">담당자 목록 로드 실패: ' + e.message + '<br>GAS_API_URL을 확인하세요.</p>';
      });
    }

    // ===== 화면 로드 =====
    document.addEventListener('DOMContentLoaded', function () {
      document.addEventListener('click', function () { initAudioContext(); }, { once: true });
      document.addEventListener('touchstart', function () { initAudioContext(); }, { once: true });

      loadManagerList();

      gasCall('getDataForSearch').then(function (d) {
        data = d ? d.slice() : [];
      }).catch(function () { data = []; });

      fetchRecentWalks();
      recentWalkInterval = setInterval(fetchRecentWalks, 5000);
      timeCheckInterval = setInterval(checkTimeouts, 10000);
    });

    // ===== 검색 + 저장 =====
    function search() {
      if (confirmOpen) return;   // 확인 팝업이 떠 있으면 스캔 무시(중첩 방지)
      beep();
      document.getElementById("tblMessage").textContent = "";
      var msgDiv = document.querySelector("#msgDiv");
      if (msgDiv) msgDiv.textContent = "";

      if (!selectedManager || selectedManager === "") {
        document.getElementById("tblMessage").textContent = "담당자를 먼저 선택해주세요.";
        loadManagerList();
        return;
      }

      var chkCode = document.getElementById('searchCode').value.trim();
      if (!chkCode) {
        document.getElementById("tblMessage").textContent = "학생 코드를 입력해주세요.";
        return;
      }
      document.getElementById('searchInput').value = chkCode;

      var searchWords = chkCode.split(/\s+/);
      var searchColumns = [2]; // 학번 컬럼
      var resultsArray = data.filter(function (r) {
        return searchWords.every(function (word) {
          return searchColumns.some(function (colIndex) {
            return r[colIndex] != null &&
              r[colIndex].toString().toLowerCase().includes(word.toLowerCase());
          });
        });
      });

      var currentTimeChk = Date.now();

      if (resultsArray.length === 1) {
        // 직전과 같은 코드를 10초 내 다시 스캔하면 무시
        if (chk_old == chkCode && (currentTimeChk - lastScannedTimeChk < 10000)) {
          lastScannedTimeChk = currentTimeChk;
          document.getElementById("tblMessage").textContent = "저장된 학생입니다.";
          document.getElementById('searchCode').value = "";
          return;
        }
        lastScannedTimeChk = currentTimeChk;
        chk_old = chkCode;

        var result = resultsArray[0];
        var h_ban = result[0] + result[1];
        var h_ksuk = result[3];
        var h_id = result[2];
        var h_name = result[5];
        var h_qtum = result[6];
        var h_hosil = result[7];
        var h_seatNo = result[8];

        var dt = new Date();
        var year = dt.getFullYear();
        var month = ('0' + (dt.getMonth() + 1)).slice(-2);
        var day = ('0' + dt.getDate()).slice(-2);
        var hh = ('0' + dt.getHours()).slice(-2);
        var mm = ('0' + dt.getMinutes()).slice(-2);
        var ss = ('0' + dt.getSeconds()).slice(-2);
        var setDateTime = year + '-' + month + '-' + day + ' ' + hh + ':' + mm + ':' + ss;

        var h_qtumAll = h_qtum + " " + h_hosil + " " + h_seatNo;

        document.getElementById('searchCode').value = "";
        document.getElementById("tblMessage").textContent = "";

        // 인원 제한 (#1,#4): 현재 산책중이 최대치면 팝업 없이 차단 + 메시지
        if (currentWalkingCount() >= WALK_LIMIT) {
          document.getElementById("tblMessage").textContent =
            "산책 인원이 가득 찼습니다 (최대 " + WALK_LIMIT + "명). 먼저 산책을 종료해 주세요.";
          chk_old = 0;   // 종료 후 같은 학생 재시도 가능하도록
          return;
        }

        // 등록 확인 팝업 (#2): 확인 시에만 등록 진행
        showConfirm("산책 등록", h_name + " 학생을 산책 등록할까요?", "🚶").then(function (ok) {
          if (!ok) { chk_old = 0; return; }

          // 팝업이 열려 있는 사이 인원이 찼을 수 있어 재확인
          if (currentWalkingCount() >= WALK_LIMIT) {
            document.getElementById("tblMessage").textContent =
              "산책 인원이 가득 찼습니다 (최대 " + WALK_LIMIT + "명). 먼저 산책을 종료해 주세요.";
            chk_old = 0;
            return;
          }

          // 낙관적(즉시) 행 추가
          var tbody = document.getElementById("searchResults");
          var templateBox = document.getElementById("rowtemplate");
          if (tbody && templateBox) {
            var template = templateBox.content.cloneNode(true);
            var tr = template.querySelector("tr");
            tr.dataset.walkTime = setDateTime;
            tr.dataset.endTime = "";
            template.querySelector(".sID").textContent = h_id;
            template.querySelector(".student").textContent = h_name;
            template.querySelector(".ban").textContent = h_ban;
            template.querySelector(".qtum").textContent = h_qtumAll;
            setWalkCell(template.querySelector(".walkTime"), setDateTime, selectedManager);
            template.querySelector(".endTime").textContent = "0분 경과";
            template.querySelector(".endTime").className = "endTime fw-bold text-secondary";
            var btn = template.querySelector(".endWalkBtn");
            btn.onclick = function () { confirmEndWalk(h_id, setDateTime, btn, tr); };
            tr.dataset.completed = "false";
            tbody.insertBefore(template, tbody.firstChild);
            updateWalkingCount();
          }

          // 서버 저장: 진행바 표시 → 완료 시 숨김 + 최근 목록 동기화
          showSaveProgress();
          gasCall('addStudent', {
            id: h_id, ban: result[0], kbn: result[1], name: h_name,
            dateTime: setDateTime, manager: selectedManager, ksuk: h_ksuk, qtumAll: h_qtumAll
          }).then(function (response) {
            hideSaveProgress();
            document.getElementById("tblMessage").textContent = "정상적으로 등록되었습니다.";
            if (response) {
              walkTimeoutMinutes = response.timeout;
              renderRecentWalks(response.data);
              checkTimeouts();
            }
          }).catch(function () {
            hideSaveProgress();
            document.getElementById("tblMessage").textContent = "저장 요청 실패 — 네트워크를 확인하세요.";
          });
        });

      } else {
        document.getElementById("tblMessage").textContent = "학생코드를 확인해주세요.";
        document.getElementById('searchCode').value = "";
      }
    }

    // ===== 최근 산책 목록 =====
    function fetchRecentWalks() {
      gasCall('getRecentWalks').then(function (response) {
        if (response) {
          walkTimeoutMinutes = response.timeout;
          renderRecentWalks(response.data);
          checkTimeouts();
        }
      }).catch(function () { });
    }

    function renderRecentWalks(list) {
      var tbody = document.getElementById("searchResults");
      if (!tbody) return;
      tbody.innerHTML = "";

      var templateBox = document.getElementById("rowtemplate");
      if (!templateBox || !list) return;

      // 오늘 등록분만 표시 (날짜가 바뀌면 전일 데이터는 자동으로 숨김)
      list = list.filter(function (item) {
        return isToday(item.walkTime);
      });

      list.forEach(function (item) {
        var template = templateBox.content.cloneNode(true);
        var tr = template.querySelector("tr");

        // 서버가 아직 종료시간을 반영하지 못했어도, 방금 로컬에서 종료한 행이면 종료 상태 유지 (깜박임 방지)
        var key = walkKey(item.id, item.walkTime);
        var effectiveEnd = item.endTime;
        if ((!effectiveEnd || effectiveEnd === "") && pendingEnds[key]) {
          effectiveEnd = pendingEnds[key];
        } else if (item.endTime && item.endTime !== "") {
          delete pendingEnds[key];   // 서버가 따라잡음 → 로컬 보호기록 정리
        }

        tr.dataset.walkTime = item.walkTime;
        tr.dataset.endTime = effectiveEnd;

        template.querySelector(".sID").textContent = item.id;
        template.querySelector(".student").textContent = item.name;
        template.querySelector(".ban").textContent = item.ban + item.kbn;
        template.querySelector(".qtum").textContent = item.qtumAll;
        setWalkCell(template.querySelector(".walkTime"), item.walkTime, item.manager);
        template.querySelector(".endTime").textContent = effectiveEnd;

        var btn = template.querySelector(".endWalkBtn");
        var endCell = template.querySelector(".endTime");

        if (effectiveEnd && effectiveEnd !== "") {
          btn.disabled = true;
          btn.className = "btn btn-sm btn-secondary";
          btn.textContent = "종료됨";
          tr.dataset.completed = "true";
          endCell.className = "endTime fw-bold text-success";
        } else {
          (function (it, b, t) {
            b.onclick = function () { confirmEndWalk(it.id, it.walkTime, b, t); };
          })(item, btn, tr);
          btn.textContent = "산책중";
          tr.dataset.completed = "false";
          endCell.className = "endTime fw-bold text-secondary";
        }

        tbody.appendChild(template);
      });

      updateWalkingCount();
    }

    // walk 시각 문자열을 형식에 상관없이 안전하게 Date로 변환
    // (구글시트가 "2026-07-01 6:05:02"처럼 시의 앞 0을 떼고 돌려줘도 파싱되도록 숫자만 추출)
    function parseWalkDate(str) {
      if (!str) return null;
      var m = String(str).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})\D+(\d{1,2})/);
      if (!m) return null;
      var d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
      return isNaN(d.getTime()) ? null : d;
    }

    // 행 식별 키 (id + 산책시각). 표시형식이 "06:05"/"6:05"로 달라도 같은 키가 되도록 시각으로 정규화
    function walkKey(id, walkTime) {
      var d = parseWalkDate(walkTime);
      return id + '|' + (d ? d.getTime() : walkTime);
    }

    // 현재 산책중(미종료) 인원 수
    function currentWalkingCount() {
      var tbody = document.getElementById("searchResults");
      return tbody ? tbody.querySelectorAll('tr[data-completed="false"]').length : 0;
    }

    // 현재 산책중(미종료) 인원 카운트 갱신
    function updateWalkingCount() {
      var el = document.getElementById("walkingCount");
      if (el) el.textContent = "산책중 : " + currentWalkingCount() + "명";
    }

    // ===== 중앙 확인 팝업 =====
    var _confirmModal = null;
    var _confirmResolve = null;

    // title/message로 팝업을 띄우고, 확인=true / 취소=false 를 Promise로 반환
    function showConfirm(title, message, icon) {
      return new Promise(function (resolve) {
        document.getElementById('confirmModalLabel').textContent = title;
        document.getElementById('confirmModalBody').textContent = message;
        document.getElementById('confirmModalIcon').textContent = icon || '🚶';
        if (!_confirmModal) {
          _confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
          document.getElementById('confirmModal').addEventListener('hidden.bs.modal', function () {
            confirmOpen = false;
            if (_confirmResolve) { var r = _confirmResolve; _confirmResolve = null; r(false); }
          });
        }
        _confirmResolve = resolve;
        confirmOpen = true;
        _confirmModal.show();
      });
    }

    function confirmOk() {
      var r = _confirmResolve; _confirmResolve = null;
      if (_confirmModal) _confirmModal.hide();
      if (r) r(true);
    }

    function confirmCancel() {
      var r = _confirmResolve; _confirmResolve = null;
      if (_confirmModal) _confirmModal.hide();
      if (r) r(false);
    }

    // 산책중 버튼 클릭 → 확인 팝업 후 실제 종료
    function confirmEndWalk(id, walkTime, btn, tr) {
      var nameEl = tr.querySelector('.student');
      var name = nameEl ? nameEl.textContent : '';
      showConfirm("산책 종료", name + " 학생의 산책을 종료할까요?", "🏁").then(function (ok) {
        if (ok) endWalk(id, walkTime, btn, tr);
      });
    }

    function checkTimeouts() {
      var tbody = document.getElementById("searchResults");
      if (!tbody) return;
      var rows = tbody.querySelectorAll("tr");
      var now = new Date().getTime();
      var timeoutMs = walkTimeoutMinutes * 60 * 1000;

      rows.forEach(function (tr) {
        var walkCell = tr.querySelector(".walkTime");
        var dtEl = walkCell ? walkCell.querySelector(".walk-dt") : null;
        var nameEl = tr.querySelector(".student");
        var walkDate = parseWalkDate(tr.dataset.walkTime);

        if (tr.dataset.completed === "true") {
          if (dtEl) dtEl.classList.remove("over");
          // 완료된 행: 실제 산책시간(종료-시작)이 허용시간을 넘었으면 이름만 강조 유지
          var endDate = parseWalkDate(tr.dataset.endTime);
          var wasOver = walkDate && endDate && (endDate.getTime() - walkDate.getTime() > timeoutMs);
          if (nameEl) nameEl.classList.toggle("over", !!wasOver);
          return;
        }

        if (!walkDate) return;

        var elapsedMs = now - walkDate.getTime();
        var elapsedMinutes = Math.floor(elapsedMs / (60 * 1000));
        if (elapsedMinutes < 0) elapsedMinutes = 0;

        var endCell = tr.querySelector(".endTime");
        if (endCell) endCell.textContent = elapsedMinutes + "분 경과";

        var over = elapsedMs > timeoutMs;
        if (dtEl) dtEl.classList.toggle("over", over);
        if (nameEl) nameEl.classList.toggle("over", over);
        if (endCell) endCell.className = "endTime fw-bold " + (over ? "text-danger" : "text-secondary");
      });

      updateWalkingCount();
    }

    function endWalk(id, walkTime, btn, tr) {
      var dt = new Date();
      var year = dt.getFullYear();
      var month = ('0' + (dt.getMonth() + 1)).slice(-2);
      var day = ('0' + dt.getDate()).slice(-2);
      var hh = ('0' + dt.getHours()).slice(-2);
      var mm = ('0' + dt.getMinutes()).slice(-2);
      var ss = ('0' + dt.getSeconds()).slice(-2);
      var endTimeStr = year + '-' + month + '-' + day + ' ' + hh + ':' + mm + ':' + ss;

      // 서버 반영 전까지 5초 갱신이 이 행을 "산책중"으로 되돌리지 못하게 보호
      var key = walkKey(id, walkTime);
      pendingEnds[key] = endTimeStr;

      btn.disabled = true;
      btn.className = "btn btn-sm btn-secondary";
      btn.textContent = "저장중...";
      tr.dataset.completed = "true";
      tr.dataset.endTime = endTimeStr;

      var endCell = tr.querySelector(".endTime");
      if (endCell) { endCell.textContent = endTimeStr; endCell.className = "endTime fw-bold text-success"; }

      var walkCell = tr.querySelector(".walkTime");
      var dtEl = walkCell ? walkCell.querySelector(".walk-dt") : null;
      if (dtEl) dtEl.classList.remove("over");

      updateWalkingCount();

      gasCall('setEndWalkTime', { id: id, walkTime: walkTime, endTime: endTimeStr })
        .then(function (success) {
          btn.textContent = success ? "종료됨" : "실패";
          if (!success) delete pendingEnds[key];   // 저장 실패 → 보호 해제(다음 갱신 때 산책중으로 되돌아가 문제 노출)
        })
        .catch(function () { btn.textContent = "실패"; delete pendingEnds[key]; });
    }

    // ===== 소리 =====
    let audioCtx = null;
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function beep() {
      try {
        const ctx = initAudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.frequency.value = 800;
        oscillator.type = 'sine';
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.8, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start(now);
        oscillator.stop(now + 0.1);
      } catch (error) {
        if (navigator.vibrate) navigator.vibrate(50);
      }
    }

    // ===== 실시간 카메라 (버셀 HTTPS 최상위 페이지라 정상 작동) =====
    async function requestCameraPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        stream.getTracks().forEach(function (t) { t.stop(); });
        return true;
      } catch (error) {
        alert("카메라 접근 권한이 필요합니다.\n(" + error.name + ": " + error.message + ")");
        return false;
      }
    }

    async function startScanner() {
      document.getElementById('stopScanner').style.display = 'block';
      document.getElementById('startScanner').style.display = 'none';

      const ok = await requestCameraPermission();
      if (!ok) {
        document.getElementById('stopScanner').style.display = 'none';
        document.getElementById('startScanner').style.display = 'block';
        return;
      }

      document.getElementById('interactive').style.display = 'block';  // 카메라 표시 영역 노출

      let lastScannedTime = 0;

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: { width: 320, height: 640, facingMode: "environment" }
        },
        decoder: { readers: ["code_128_reader"] },
        locate: true,
        locator: { patchSize: "large", halfSample: false },
        frequency: 30,
        area: { top: "10%", right: "10%", left: "10%", bottom: "10%" }
      }, function (err) {
        if (err) {
          console.log(err);
          alert("카메라 초기화 실패: " + err);
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(function (data) {
        const currentTime = Date.now();
        if (currentTime - lastScannedTime < 9000) return; // 9초 내 중복 방지
        lastScannedTime = currentTime;

        beep();
        const barcodeValue = data.codeResult.code;
        document.getElementById('barcodeInput').value = barcodeValue;
        document.getElementById('searchCode').value = barcodeValue;
        search();
      });
    }

    function stopScanner() {
      try { Quagga.stop(); } catch (e) { }
      var interactive = document.getElementById('interactive');
      if (interactive) {
        interactive.style.display = 'none';   // 카메라 표시 영역 숨김
        interactive.innerHTML = '';           // 남은 정지 화면(video/canvas) 제거
      }
      document.getElementById('stopScanner').style.display = 'none';
      document.getElementById('startScanner').style.display = 'block';
    }

    // ===== 이름 자동완성 =====
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'searchCode') handleSearchCodeInput(e.target);
    });
    document.addEventListener('focusin', function (e) {
      if (e.target && e.target.id === 'searchCode') handleSearchCodeInput(e.target);
    });

    function handleSearchCodeInput(inputElement) {
      const autocompleteList = document.getElementById('autocomplete-list');
      if (!autocompleteList) return;

      const val = inputElement.value.trim();
      autocompleteList.innerHTML = '';

      if (!val || !data || data.length === 0) {
        autocompleteList.style.display = 'none';
        return;
      }

      const matches = data.filter(function (student) {
        const name = student[5] ? student[5].toString() : '';
        return name.toLowerCase().includes(val.toLowerCase());
      });

      if (matches.length === 0) {
        autocompleteList.style.display = 'none';
        return;
      }

      matches.slice(0, 10).forEach(function (student) {
        const ban = (student[0] || '') + (student[1] || '');
        const id = student[2] || '';
        const name = student[5] || '';

        const item = document.createElement('a');
        item.href = 'javascript:void(0);';
        item.className = 'list-group-item list-group-item-action py-2 px-3';
        item.style.fontSize = '15px';
        item.style.cursor = 'pointer';
        item.innerHTML = '<strong>' + name + '</strong> <span class="text-muted" style="font-size: 13px;">(' + ban + ')</span>';

        item.addEventListener('click', function (e) {
          e.preventDefault();
          inputElement.value = id;
          autocompleteList.innerHTML = '';
          autocompleteList.style.display = 'none';
          search();
        });

        autocompleteList.appendChild(item);
      });

      autocompleteList.style.display = 'block';
    }

    document.addEventListener('click', function (e) {
      const autocompleteList = document.getElementById('autocomplete-list');
      const searchCode = document.getElementById('searchCode');
      if (autocompleteList && e.target !== searchCode && !autocompleteList.contains(e.target)) {
        autocompleteList.style.display = 'none';
      }
    });
  </script>
</body>

</html>
