<head>
  <meta charset="utf-8">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-size: 30px;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #f8f9fa;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-left: 10px;
      padding-right: 10px;
      box-sizing: border-box;
    }

    #interactive {
      width: 95%;
      height: auto;
      max-height: 100%;
      margin: 0 auto;
      padding: 0;
      display: block;
      /* border: 3px solid #fc0606; */
      box-sizing: border-box;
    }

    canvas.drawing,
    canvas.drawingBuffer {
      position: absolute;
      top: 0;
      left: 0;
    }

    #resultBox {
      width: 90%;
      text-align: center;
      margin: 9px auto 0;
      padding: 0;
      box-sizing: border-box;
    }

    #barcodeInput {
      width: 90%;
      height: 45px;
      font-size: 16.2px;
      padding: 4.5px;
      box-sizing: border-box;
    }

    input[type="button"] {
      width: 43.2%;
      margin: 4.5px 1%;
      font-size: 14.4px;
      padding: 9px;
    }

    @media (orientation: portrait) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      #interactive {
        width: 95%;
        max-width: 95%;
        margin: 0 auto;
      }

      #resultBox {
        width: 90%;
        margin: 9px auto 0;
      }

      #barcodeInput {
        width: 90%;
      }
    }

    #msgDiv {
      font-size: 50px;
      padding: 5px;
      box-sizing: border-box;
    }

    /* 통계 표시 카드 스타일 */
    .stats-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 18px;
      box-shadow: 0 9px 27px rgba(0, 0, 0, 0.2);
      padding: 22.5px;
      margin: 18px auto;
      max-width: 85.5%;
      color: white;
    }

    .student-name-header {
      font-size: 0.6rem;
      /* 18px - 한 단계 크게 */
      font-weight: 900;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      margin-bottom: 18px;
      padding-bottom: 13.5px;
      border-bottom: 3px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 2px;
    }

    .stats-total {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 13.5px;
      padding: 18px;
      margin: 13.5px 0;
      font-size: 0.6rem;
      /* 18px - 한 단계 크게 */
      font-weight: bold;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .stats-period {
      display: flex;
      justify-content: space-around;
      margin: 18px 0;
      flex-wrap: wrap;
      gap: 9px;
    }

    .stats-period-item {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10.8px;
      padding: 13.5px 18px;
      flex: 1;
      min-width: 126px;
      text-align: center;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s;
    }

    .stats-period-item:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.35);
    }

    .stats-period-label {
      font-size: 0.54rem;
      /* 16.2px - 한 단계 크게 */
      opacity: 0.9;
      margin-bottom: 4.5px;
    }

    .stats-period-value {
      font-size: 0.6rem;
      /* 18px - 한 단계 크게 */
      font-weight: bold;
    }

    .stats-time-section {
      margin-top: 22.5px;
      padding-top: 18px;
      border-top: 2px solid rgba(255, 255, 255, 0.3);
    }

    .stats-time-title {
      font-size: 0.54rem;
      /* 16.2px - 한 단계 크게 */
      font-weight: bold;
      margin-bottom: 13.5px;
      text-align: center;
    }

    .stats-time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10.8px;
    }

    .stats-time-item {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9px;
      padding: 10.8px;
      text-align: center;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .stats-time-label {
      font-size: 0.54rem;
      /* 16.2px - 한 단계 크게 */
      opacity: 0.9;
      margin-bottom: 4.5px;
    }

    .stats-time-value {
      font-size: 0.6rem;
      /* 18px - 한 단계 크게 */
      font-weight: bold;
    }

    .container-fluid {
      max-width: 100%;
      padding-left: 5px;
      padding-right: 5px;
    }

    /* 담당자 선택 모달 스타일 */
    #managerModal {
      z-index: 9999;
    }

    .manager-select-btn {
      font-size: 1.2rem;
      padding: 15px 20px;
      margin: 8px 0;
      width: 100%;
      text-align: center;
    }

    @media (max-width: 600px) {
      .student-name-header {
        font-size: 0.6rem;
        /* 18px - 한 단계 크게 */
      }

      .stats-total {
        font-size: 0.6rem;
        /* 18px - 한 단계 크게 */
      }

      .stats-time-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

<body>
  <!-- 담당자 선택 모달 -->
  <div class="modal fade" id="managerModal" tabindex="-1" aria-labelledby="managerModalLabel" aria-hidden="true"

  <div class="container-fluid p-0">
    <div id="interactive" class="viewport"></div>

      <input type="text" id="barcodeInput" placeholder="스캔된 바코드가 여기에 표시됩니다" readonly>

    <!-- [추가] 스캔된 학생 정보 카드 -->
    <div id="studentCard" class="card text-center mb-3 shadow-sm"
      style="display:none; border: 2px solid #0d6efd; max-width: 90%; margin: 0 auto;">
      <div class="card-header bg-primary text-white">

    <div id="app"></div>
    <!-- [추가] 통계 결과 표시 영역 -->
    <div id="statsDisplay" class="stats-card" style="display:none;">
      <div class="student-name-header" id="statsStudentName"></div>
      <div class="stats-total" id="statsTotal"></div>
      <div class="stats-period">
        <div class="stats-period-item">
          <div class="stats-period-label">이번주</div>
          <div class="stats-period-value" id="statsWeek">0</div>
        </div>
        <div class="stats-period-item">
          <div class="stats-period-label">이번달</div>
          <div class="stats-period-value" id="statsMonth">0</div>
        </div>
      </div>
      <div class="stats-time-section">
        <div class="stats-time-title">⏰ 시간대별 현황</div>
        <div class="stats-time-grid">
          <div class="stats-time-item">
            <div class="stats-time-label">🌅 아침<br>(06:30-07:59)</div>
            <div class="stats-time-value" id="statsT1">0</div>
          </div>
          <div class="stats-time-item">
            <div class="stats-time-label">☀️ 오전<br>(08:00-11:59)</div>
            <div class="stats-time-value" id="statsT2">0</div>
          </div>
          <div class="stats-time-item">
            <div class="stats-time-label">🌤️ 오후<br>(13:00-17:00)</div>
            <div class="stats-time-value" id="statsT3">0</div>
          </div>
          <div class="stats-time-item">
            <div class="stats-time-label">🌙 저녁<br>(18:00-23:00)</div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>



  <script>

    var data, data1, returnData, setDateTime;
    var writeData = [];
    var h_ban = "", h_kbn = "", h_id = "", h_name = "", h_startEnd = "", colorKbn = 0;
    var itemCount = 0;
    var chk_old = 0;
    var lastScannedTimeChk = 0;
    var selectedManager = ""; // 선택된 담당자 (프로그램 종료 전까지 유지)

    var walkTimeoutMinutes = 10;
    var recentWalkInterval = null;
    var timeCheckInterval = null;



    function loadView(options) {
      var id = typeof options.id === "undefined" ? "app" : options.id;
      var cb = typeof options.callback === "undefined" ? function () { } : options.callback;
      google.script.run.withSuccessHandler(function (html) {
        document.getElementById(id).innerHTML = html;
        typeof options.params === "undefined" ? cb() : cb(options.params);

        document.getElementById('searchInput').value = "";

        document.getElementById('searchCode').focus();


      })[options.func]();
    }

    function maxLengthCheck(object) {
      if (object.value.length > object.maxLength) {
        object.value = object.value.slice(0, object.maxLength);
      };
    }

    // 담당자 선택 함수
    function selectManager(managerName) {
      selectedManager = managerName;
      // 모달 숨기기
      const modal = bootstrap.Modal.getInstance(document.getElementById('managerModal'));
      if (modal) {
        modal.hide();
      }
      // 담당자 선택 후, "사진으로 스캔" 버튼만 노출 (스캔은 버튼을 눌러 진행)
      document.getElementById('startScanner').style.display = 'block';
      document.getElementById('barcodeInput').style.display = 'none';
    }

    // 담당자 목록 로드 및 모달 표시
    function loadManagerList() {
      google.script.run.withSuccessHandler(function (managers) {
        const managerListDiv = document.getElementById('managerList');
        managerListDiv.innerHTML = '';

        if (managers.length === 0) {
          managerListDiv.innerHTML = '<p class="text-danger">담당자 목록이 없습니다. wakeup담당자 시트를 확인해주세요.</p>';
          // 담당자가 없어도 진행 가능하도록
          setTimeout(function () {
            selectManager("");
          }, 2000);
          return;
        }

        managers.forEach(function (manager) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-outline-primary manager-select-btn';
          btn.textContent = manager;
          btn.onclick = function () {
            selectManager(manager);
          };
          managerListDiv.appendChild(btn);
        });

        // 모달 표시
        const modal = new bootstrap.Modal(document.getElementById('managerModal'));
        modal.show();
      }).getManagerList();
    }

    // 화면 로드 시 데이터 조회
    document.addEventListener('DOMContentLoaded', function () {
      // AudioContext 초기화 (사용자 상호작용 시)
      document.addEventListener('click', function () {
        initAudioContext();
      }, { once: true });
      document.addEventListener('touchstart', function () {
        initAudioContext();
      }, { once: true });

      // 담당자 목록 로드 및 선택 모달 표시
      loadManagerList();

      // 학생 데이터 조회
      google.script.run.withSuccessHandler(function (dataReturned) {
        // console.log(dataReturned);
        data = dataReturned.slice();
      }).getDataForSearch();

      // [추가] 초기 목록 및 폴링 시작
      fetchRecentWalks();
      recentWalkInterval = setInterval(fetchRecentWalks, 5000);
      timeCheckInterval = setInterval(checkTimeouts, 10000);
    });


    function search() {
      beep();
      document.getElementById("tblMessage").textContent = "";
      document.querySelector("#msgDiv").textContent = "";

      // 담당자 선택 확인
      if (!selectedManager || selectedManager === "") {
        document.getElementById("tblMessage").textContent = "담당자를 먼저 선택해주세요.";
        // 담당자 선택 모달 다시 표시
        loadManagerList();
        return;
      }

      // 기존 표시된 데이터 삭제/숨김
      document.getElementById("statsDisplay").style.display = "none";
      document.getElementById("studentCard").style.display = "none";
      // 표를 초기화하지 않음 (폴링/응답으로 갱신)

      // 통계 데이터 초기화
      document.getElementById("statsStudentName").textContent = "";
      document.getElementById("statsTotal").innerHTML = "";
      document.getElementById("statsWeek").textContent = "0";
      document.getElementById("statsMonth").textContent = "0";
      document.getElementById("statsT1").textContent = "0건";
      document.getElementById("statsT2").textContent = "0건";
      document.getElementById("statsT3").textContent = "0건";
      document.getElementById("statsT4").textContent = "0건";

      // resetAllCheckboxes();  

      var chkCode = document.getElementById('searchCode').value.trim();
      if (!chkCode) {
        document.getElementById("tblMessage").textContent = "학생 코드를 입력해주세요.";
        return;
      }

      document.getElementById('searchInput').value = chkCode;


      var searchInput = chkCode;
      var searchWords = searchInput.split(/\s+/);
      var searchColumns = [2];

      var resultsArray = searchInput === "" ? [] : data.filter(function (r) {
        return searchWords.every(function (word) {
          return searchColumns.some(function (colIndex) {
            return r[colIndex].toString().toLowerCase().includes(word.toLowerCase());
          });
        });
      });

      h_ban = "";
      h_ksuk = "";
      h_id = "";
      h_name = "";
      h_qtum = "";
      h_hosil = "";
      h_seatNo = "";

      var currentTimeChk = Date.now();

      if (resultsArray.length === 1) {
        console.log(chk_old, searchInput);
        if (chk_old == searchInput) {
          if (currentTimeChk - lastScannedTimeChk < 10000) {
            lastScannedTimeChk = currentTimeChk;
            document.getElementById("tblMessage").textContent = "  저장된 학생입니다.";
            document.getElementById('searchCode').value = "";
            // document.getElementById('searchCode').focus();
            return;
          }
        }
        lastScannedTimeChk = currentTimeChk;

        var result = resultsArray[0];
        h_ban = result[0] + result[1];
        h_ksuk = result[3];
        h_id = result[2];
        h_name = result[5];
        h_qtum = result[6];
        h_hosil = result[7];
        h_seatNo = result[8];

        var dt = new Date();
        var year = dt.getFullYear();
        var month = ('0' + (dt.getMonth() + 1)).slice(-2);
        var day = ('0' + dt.getDate()).slice(-2);
        var dateString = year + '-' + month + '-' + day + ' ';
        var h_hours = dt.getHours(), h_minutes = dt.getMinutes(), h_seconds = dt.getSeconds();
        if (h_hours < 10) {
          h_hours = "0" + dt.getHours();
        }
        if (h_minutes < 10) {
          h_minutes = "0" + dt.getMinutes();
        }
        if (h_seconds < 10) {
          h_seconds = "0" + dt.getSeconds();
        }

        var str = `${h_hours}:${h_minutes}:${h_seconds}`;
        setDateTime = dateString + str;
        
        var h_qtumAll = h_qtum + " " + h_hosil + " " + h_seatNo;

        // 즉시 입력란 클리어
        document.getElementById('searchCode').value = "";
        // document.getElementById('searchCode').focus(); // 모바일 카메라 에러 원인으로 제거
        document.getElementById("tblMessage").textContent = "정상적으로 등록되었습니다.";

        // 서버 응답 대기 시간 없이 화면에 즉시(낙관적) 추가
        var tbody = document.getElementById("searchResults");
        var templateBox = document.getElementById("rowtemplate");
        if (tbody && templateBox) {
          var template = templateBox.content.cloneNode(true);
          var tr = template.querySelector("tr");
          tr.dataset.walkTime = setDateTime;
          tr.dataset.endTime = "";
          template.querySelector(".sID").textContent = h_id;
          template.querySelector(".student").textContent = h_name;
          template.querySelector(".ban").textContent = h_ban;
          template.querySelector(".qtum").textContent = h_qtumAll;
          template.querySelector(".walkTime").textContent = setDateTime;
          template.querySelector(".endTime").textContent = "0분 경과";
          template.querySelector(".endTime").className = "endTime fw-bold text-secondary";
          var btn = template.querySelector(".endWalkBtn");
          btn.onclick = function() { endWalk(h_id, setDateTime, btn, tr); };
          tr.dataset.completed = "false";
          tbody.insertBefore(template, tbody.firstChild);
        }

        // 서버에 데이터 저장 및 전체 최근 목록 동기화
        google.script.run.withSuccessHandler(function (response) {
          if (response) {
            walkTimeoutMinutes = response.timeout;
            renderRecentWalks(response.data);
            checkTimeouts();
          }
        }).addStudent(h_id, result[0], result[1], h_name, setDateTime, selectedManager, h_ksuk, h_qtumAll);

      } else {
        document.getElementById("tblMessage").textContent = "  학생코드를 확인해주세요.";
        document.getElementById('searchCode').value = "";
        // document.getElementById('searchCode').focus();
        document.getElementById("searchResults").innerText = "";
      }
    }

    // 유효성 검사 추가
    function validateInputs() {

      if (!h_ban || !h_id || !h_name) {
        document.getElementById("tblMessage").textContent = "반, 코드, 이름을 확인해주세요.";
        document.getElementById('searchCode').value = "";
        // document.getElementById('searchCode').focus();
        return false;
      }
      return true;
    }

    function loadSearchView() {
      loadView({ func: "loadSearchView" });
    }

    loadSearchView();

    // ---------------- [추가] 산책 관리 함수들 ----------------
    function fetchRecentWalks() {
      google.script.run.withSuccessHandler(function (response) {
        if (response) {
          walkTimeoutMinutes = response.timeout;
          renderRecentWalks(response.data);
          checkTimeouts();
        }
      }).getRecentWalks();
    }

    function renderRecentWalks(list) {
      var tbody = document.getElementById("searchResults");
      if (!tbody) return;
      tbody.innerHTML = "";

      var templateBox = document.getElementById("rowtemplate");
      if (!templateBox) return;

      list.forEach(function (item) {
        var template = templateBox.content.cloneNode(true);
        var tr = template.querySelector("tr");

        tr.dataset.walkTime = item.walkTime;
        tr.dataset.endTime = item.endTime;

        template.querySelector(".sID").textContent = item.id;
        template.querySelector(".student").textContent = item.name;
        template.querySelector(".ban").textContent = item.ban + item.kbn;
        template.querySelector(".qtum").textContent = item.qtumAll;
        template.querySelector(".walkTime").textContent = item.walkTime;
        template.querySelector(".endTime").textContent = item.endTime;

        var btn = template.querySelector(".endWalkBtn");
        var endCell = template.querySelector(".endTime");

        if (item.endTime && item.endTime !== "") {
           btn.disabled = true;
           btn.className = "btn btn-sm btn-secondary";
           btn.textContent = "종료됨";
           tr.dataset.completed = "true";
           endCell.className = "endTime fw-bold text-success";
        } else {
           btn.onclick = function() {
              endWalk(item.id, item.walkTime, btn, tr);
           };
           btn.textContent = "산책중";
           tr.dataset.completed = "false";
           endCell.className = "endTime fw-bold text-secondary";
        }

        tbody.appendChild(template);
      });
    }

    function checkTimeouts() {
      var tbody = document.getElementById("searchResults");
      if (!tbody) return;
      var rows = tbody.querySelectorAll("tr");
      var now = new Date().getTime();
      var timeoutMs = walkTimeoutMinutes * 60 * 1000;

      rows.forEach(function (tr) {
        if (tr.dataset.completed === "true") {
          var walkCell = tr.querySelector(".walkTime");
          if (walkCell) {
            walkCell.style.color = "";
            walkCell.style.backgroundColor = "";
          }
          return;
        }

        var walkTimeStr = tr.dataset.walkTime;
        if (!walkTimeStr) return;

        var dtStr = walkTimeStr.replace(" ", "T");
        var walkDate = new Date(dtStr);
        
        if (!isNaN(walkDate.getTime())) {
          var elapsedMs = now - walkDate.getTime();
          var elapsedMinutes = Math.floor(elapsedMs / (60 * 1000));
          if (elapsedMinutes < 0) elapsedMinutes = 0;
          
          var endCell = tr.querySelector(".endTime");
          if (endCell) {
            endCell.textContent = elapsedMinutes + "분 경과";
          }

          var walkCell = tr.querySelector(".walkTime");
          if (elapsedMs > timeoutMs) {
            if(walkCell) {
              walkCell.style.color = "white";
              walkCell.style.backgroundColor = "red";
            }
            if (endCell) {
              endCell.className = "endTime fw-bold text-danger"; // 타임아웃 넘으면 빨간색으로
            }
          } else {
            if(walkCell) {
              walkCell.style.color = "";
              walkCell.style.backgroundColor = "";
            }
            if (endCell) {
              endCell.className = "endTime fw-bold text-secondary";
            }
          }
        }
      });
    }

    function endWalk(id, walkTime, btn, tr) {
      var dt = new Date();
      var year = dt.getFullYear();
      var month = ('0' + (dt.getMonth() + 1)).slice(-2);
      var day = ('0' + dt.getDate()).slice(-2);
      var h_hours = ('0' + dt.getHours()).slice(-2);
      var h_minutes = ('0' + dt.getMinutes()).slice(-2);
      var h_seconds = ('0' + dt.getSeconds()).slice(-2);
      var endTimeStr = year + '-' + month + '-' + day + ' ' + h_hours + ':' + h_minutes + ':' + h_seconds;

      btn.disabled = true;
      btn.className = "btn btn-sm btn-secondary";
      btn.textContent = "저장중..."; // 서버 처리 전 임시 표시
      tr.dataset.completed = "true";
      
      var endCell = tr.querySelector(".endTime");
      if(endCell) {
        endCell.textContent = endTimeStr;
        endCell.className = "endTime fw-bold text-success";
      }

      var walkCell = tr.querySelector(".walkTime");
      if (walkCell) {
        walkCell.style.color = "";
        walkCell.style.backgroundColor = "";
      }

      // 항상 학번 입력창으로 포커스 복귀 (모바일 키보드 팝업으로 인한 카메라 에러 때문에 주석처리)
      // document.getElementById('searchCode').focus();

      google.script.run.withSuccessHandler(function (success) {
        if (!success) {
          console.log("종료 기록 실패");
          btn.textContent = "실패";
        } else {
          btn.textContent = "종료됨";
        }
      }).setEndWalkTime(id, walkTime, endTimeStr);
    }
    // ---------------- [추가 끝] ----------------

    // AudioContext 초기화 (사용자 상호작용 후 활성화)
    let audioCtx = null;
    let gainNode = null;

    // AudioContext 초기화 함수
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.8; // 볼륨 조정
      }
      // AudioContext가 suspended 상태면 resume
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // beep 함수 개선
    function beep() {
      try {
        const ctx = initAudioContext();

        // 더 명확한 소리를 위한 설정
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        // 주파수 조정 (800Hz가 더 명확함)
        oscillator.frequency.value = 800;
        oscillator.type = 'sine';

        // 볼륨 엔벨로프 (부드러운 시작과 끝)
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.8, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.1); // 100ms 지속

        console.log('beep sound played');
      } catch (error) {
        console.error('Beep error:', error);
        // 대체 방법: 진동 (모바일)
        if (navigator.vibrate) {
          navigator.vibrate(50);
        }
      }
    }

    //--------------------------------------------
    // [사진 촬영 방식] GAS 주소(googleusercontent.com iframe)에서는 실시간 카메라(getUserMedia)가
    // 크롬 정책상 차단되므로, OS 카메라 앱으로 사진을 찍어 바코드를 해독하는 방식으로 동작한다.

    // "사진으로 스캔" 버튼 → 휴대폰 기본 카메라 앱 열기
    function startScanner() {
      var input = document.getElementById('cameraCapture');
      input.value = ""; // 같은 사진을 다시 찍을 수 있도록 초기화
      input.click();
    }

    // 사진 촬영 방식에서는 끌 실시간 카메라가 없음 (기존 호출 호환용 빈 함수)
    function stopScanner() { }

    // 촬영된 사진에서 바코드 해독
    function handlePhotoScan(event) {
      var file = event.target.files && event.target.files[0];
      if (!file) return;

      // 기존 표시 초기화
      document.getElementById("statsDisplay").style.display = "none";
      document.getElementById("studentCard").style.display = "none";
      document.getElementById("tblMessage").textContent = "바코드 해독 중...";

      var imgUrl = URL.createObjectURL(file);

      Quagga.decodeSingle({
        src: imgUrl,
        numOfWorkers: 0,               // 사진 1장 해독은 워커 없이 처리
        inputStream: { size: 1600 },   // 큰 사진을 1600px로 줄여 속도/정확도 확보
        locate: true,
        locator: { patchSize: "large", halfSample: false },
        decoder: { readers: ["code_128_reader"] }  // Code 128 바코드
      }, function (result) {
        URL.revokeObjectURL(imgUrl);

        if (result && result.codeResult && result.codeResult.code) {
          beep();
          var code = result.codeResult.code;
          document.getElementById('barcodeInput').value = code;
          document.getElementById('searchCode').value = code;
          search();  // 기존 조회·저장 로직 그대로 사용
        } else {
          document.getElementById("tblMessage").textContent =
            "바코드를 읽지 못했습니다. 더 가까이·밝게, 흔들리지 않게 다시 촬영해주세요.";
        }
      });
    }

    // 실시간 자동완성 검색 기능 (이벤트 위임 적용)
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'searchCode') {
        handleSearchCodeInput(e.target);
      }
    });

    document.addEventListener('focusin', function (e) {
      if (e.target && e.target.id === 'searchCode') {
        handleSearchCodeInput(e.target);
      }
    });

    function handleSearchCodeInput(inputElement) {
      const autocompleteList = document.getElementById('autocomplete-list');
      if (!autocompleteList) return;

      const val = inputElement.value.trim();
      autocompleteList.innerHTML = '';

      if (!val) {
        autocompleteList.style.display = 'none';
        return;
      }

      if (!data) return; // 아직 학생 마스터 데이터가 로드되지 않음

      // 이름(student[5])에서 실시간 검색
      const matches = data.filter(function (student) {
        const name = student[5] ? student[5].toString() : '';
        return name.toLowerCase().includes(val.toLowerCase());
      });

      if (matches.length === 0) {
        autocompleteList.style.display = 'none';
        return;
      }

      // 최대 10개 노출
      const limitMatches = matches.slice(0, 10);

      limitMatches.forEach(function (student) {
        const ban = (student[0] || '') + (student[1] || '');
        const id = student[2] || '';
        const name = student[5] || '';

        const item = document.createElement('a');
        item.href = 'javascript:void(0);';
        item.className = 'list-group-item list-group-item-action py-2 px-3';
        item.style.fontSize = '15px';
        item.style.cursor = 'pointer';
        item.innerHTML = `<strong>${name}</strong> <span class="text-muted" style="font-size: 13px;">(${ban})</span>`;

        item.addEventListener('click', function (e) {
          e.preventDefault();
          inputElement.value = id;
          autocompleteList.innerHTML = '';
          autocompleteList.style.display = 'none';
          search();
        });

        autocompleteList.appendChild(item);
      });

      autocompleteList.style.display = 'block';
    }

    // 바깥 영역 클릭 시 드롭다운 닫기
    document.addEventListener('click', function (e) {
      const autocompleteList = document.getElementById('autocomplete-list');
      const searchCode = document.getElementById('searchCode');
      if (autocompleteList && e.target !== searchCode && !autocompleteList.contains(e.target)) {
        autocompleteList.style.display = 'none';
      }
    });
  </script>
