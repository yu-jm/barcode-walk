<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-size: 14.5px;
      line-height: 1.35;
      background: linear-gradient(135deg, #eceff1 0%, #cfd8dc 50%, #b0bec5 100%);
      min-height: 100vh;
    }

    .container-fluid {
      padding: 12px 15px;
      max-width: 1024px;
      margin: 0 auto;
    }

    .search-section {
      background: linear-gradient(145deg, #fafafa 0%, #f5f5f5 100%);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e0e0;
    }

    .result-section {
      background: linear-gradient(145deg, #fafafa 0%, #f5f5f5 100%);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e0e0;
    }

    .student-search-container {
      position: relative;
    }

    .student-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .student-dropdown-item {
      padding: 8px 15px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .student-dropdown-item:hover {
      background-color: #f0f0f0;
    }

    .student-dropdown-item:last-child {
      border-bottom: none;
    }

    .student-count-badge {
      color: red;
      font-size: 0.75em;
      margin-left: 4px;
      font-weight: normal;
    }

    .count-badge {
      font-size: 1.08rem;
      font-weight: 600;
      padding: 10px 18px;
      background: linear-gradient(135deg, #455a64 0%, #546e7a 100%);
      color: #fff;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid #37474f;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .table-responsive {
      max-height: 540px;
      overflow-y: auto;
    }

    table thead {
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #37474f 0%, #455a64 100%);
      color: #fff;
      z-index: 10;
      font-size: 0.85rem;
      font-weight: 600;
    }

    table thead th {
      border-bottom: 2px solid #607d8b;
      padding: 8px 12px;
    }

    table tbody td {
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    /* 순위별 1~3위 강조 - 건수 주의 구간 */
    .rank-row-1 {
      background: linear-gradient(90deg, rgba(211, 47, 47, 0.15) 0%, rgba(244, 67, 54, 0.08) 100%) !important;
      border-left: 4px solid #c62828;
      box-shadow: inset 0 0 20px rgba(211, 47, 47, 0.05);
    }

    .rank-row-1 td {
      font-weight: 600;
    }

    .rank-cell-1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #b71c1c;
    }

    .rank-row-2 {
      background: linear-gradient(90deg, rgba(185, 121, 121, 0.15) 0%, rgba(244, 67, 54, 0.08) 100%) !important;
      border-left: 4px solid #d652f1;
      box-shadow: none;
    }

    .rank-row-2 td {
      font-weight: 500;
    }

    .rank-cell-2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #424242;
    }

    .rank-row-3 {
      background: linear-gradient(90deg, rgba(245, 124, 0, 0.1) 0%, rgba(255, 171, 64, 0.05) 100%) !important;
      border-left: 4px solid #ef6c00;
      box-shadow: inset 0 0 15px rgba(245, 124, 0, 0.05);
    }

    .rank-row-3 td {
      font-weight: 500;
    }

    .rank-cell-3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #e65100;
    }

    .demerit-count {
      color: #c62828;
      font-weight: 600;
    }

    /* 버튼 - 건수 조회 테마 */
    .btn {
      font-size: 0.85rem;
      padding: 6px 16px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #546e7a 0%, #455a64 100%);
      border-color: #37474f;
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #607d8b 0%, #546e7a 100%);
      border-color: #455a64;
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(69, 90, 100, 0.4);
    }

    .btn-outline-primary {
      color: #546e7a;
      border-color: #78909c;
      font-size: 0.85rem;
      padding: 6px 12px;
      background-color: transparent;
    }

    .btn-outline-primary:hover,
    .btn-check:checked+.btn-outline-primary {
      background: rgba(96, 125, 139, 0.15);
      border-color: #546e7a;
      color: #37474f;
    }

    .btn-lg {
      font-size: 0.95rem;
      padding: 8px 20px;
    }

    /* 제목 - 건수 조회 테마 */
    h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #37474f;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      margin-bottom: 18px;
    }

    .datetime-display {
      font-size: 0.75rem;
      font-weight: 400;
      color: #78909c;
      margin-left: 10px;
    }

    /* 테이블 스타일 */
    .table {
      margin-bottom: 0;
    }

    .table-striped>tbody>tr:nth-of-type(odd):not(.rank-row-1):not(.rank-row-2):not(.rank-row-3)>td {
      background-color: rgba(245, 245, 245, 0.8);
    }

    .table-hover>tbody>tr:hover>td {
      background-color: rgba(224, 224, 224, 0.6) !important;
    }

    .form-label {
      color: #37474f;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    .form-control,
    .form-select {
      border-color: #b0bec5;
      background-color: #fff;
      padding: 0.4rem 0.55rem;
      font-size: 0.9em;
      min-height: calc(1.5em + 0.8rem);
    }

    .search-section .row.g-3 {
      --bs-gutter-y: 0.6rem;
    }

    .result-section .count-badge+.table-responsive {
      margin-top: 0;
    }

    .chart-box {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      margin-bottom: 8px;
      min-height: 260px;
    }

    .chart-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #37474f;
      margin-bottom: 8px;
    }

    .chart-box canvas {
      max-height: 240px;
    }

    @media (max-width: 768px) {
      .date-range-group {
        flex-direction: column;
      }

      .date-range-group .form-control {
        margin-bottom: 10px;
      }
    }
  </style>
  <title>건수 현황 조회</title>
</head>

<body>
  <div class="container-fluid">
    <h2 class="mb-4 text-center">
      📋 walk 건수 현황 조회
      <span class="datetime-display" id="currentDateTime"></span>
    </h2>

    <!-- 검색 섹션 -->
    <div class="search-section">
      <div class="row g-3">
        <!-- 학생 검색 -->
        <div class="col-md-6">
          <label class="form-label">학생 검색 (코드 또는 이름)</label>
          <div class="student-search-container">
            <input type="text" class="form-control" id="studentSearch" placeholder="학생 코드 또는 이름을 입력하세요"
              autocomplete="off" onclick="searchStudents(this.value='')">
            <div class="student-dropdown" id="studentDropdown"></div>
          </div>
        </div>

        <!-- 담당자 선택 -->
        <div class="col-md-6">
          <label class="form-label">담당자</label>
          <select class="form-select" id="managerSelect">
            <option value="전체">전체</option>
          </select>
        </div>

        <!-- 조회 유형 -->
        <div class="col-md-12">
          <label class="form-label">조회 유형</label>
          <select class="form-select" id="queryTypeSelect">
            <option value="전체">전체</option>
            <option value="기간별">기간별</option>
            <option value="순위별">순위별</option>
          </select>
        </div>

        <!-- 기간별 날짜 선택 -->
        <div class="col-md-12" id="dateRangeGroup" style="display:none;">
          <div class="row date-range-group">
            <div class="col-md-6">
              <label class="form-label">시작일</label>
              <input type="date" class="form-control" id="startDate">
            </div>
            <div class="col-md-6">
              <label class="form-label">종료일</label>
              <input type="date" class="form-control" id="endDate">
            </div>
          </div>
        </div>

        <!-- 순위별 조건 선택 (현재 날짜 기준, 지난/현재 기간만 표시) -->
        <div class="col-md-12" id="rankGroup" style="display:none;">
          <label class="form-label">순위 조건</label>
          <select class="form-select" id="rankConditionSelect">
            <optgroup label="전체 누적">
              <option value="all">전체 누적 1~10순위</option>
            </optgroup>
            <optgroup label="월별" id="monthOptgroup"></optgroup>
            <optgroup label="분기" id="quarterOptgroup"></optgroup>
            <optgroup label="주별" id="weekOptgroup"></optgroup>
          </select>
        </div>

        <!-- 조회 버튼 -->
        <div class="col-md-12">
          <button type="button" class="btn btn-primary w-100" onclick="searchData()">
            🔍 조회하기
          </button>
        </div>
      </div>
    </div>

    <!-- 결과 섹션 -->
    <div class="result-section" id="resultSection" style="display:none;">
      <!-- 건수 표시 -->
      <div class="count-badge" id="resultCount">
        총 0 건
      </div>

      <!-- 결과 테이블 -->
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr id="resultTableHead">
              <th>학번</th>
              <th>반</th>
              <th>구분</th>
              <th>이름</th>
              <th>기숙사</th>
              <th>퀀텀</th>
              <th>walk 시간</th>
              <th>담당자</th>
            </tr>
          </thead>
          <tbody id="resultTableBody">
          </tbody>
        </table>
      </div>

      <!-- 통계 차트 (가로 막대 + 꺾은선) -->
      <div class="result-section mt-3" id="chartSection" style="display:none;">
        <div class="row g-2">
          <div class="col-md-6">
            <div class="chart-box">
              <div class="chart-title">순위별 건수 (상위 10명)</div>
              <canvas id="barChart"></canvas>
            </div>
          </div>
          <div class="col-md-6">
            <div class="chart-box">
              <div class="chart-title">기간별 건수 추이</div>
              <canvas id="lineChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
    integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
    crossorigin="anonymous"></script>

  <script>
    let selectedStudentId = "";
    let searchTimeout = null;
    let studentListBuffer = []; // 학생 목록 버퍼
    let barChartInstance = null;
    let lineChartInstance = null;

    // 날짜/시간 표시 업데이트
    function updateDateTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const dateTimeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      document.getElementById('currentDateTime').textContent = dateTimeStr;
    }

    // 화면 로드 시 초기화
    document.addEventListener('DOMContentLoaded', function () {
      loadManagerList();
      loadStudentList(); // 학생 목록 미리 로드
      setupEventListeners();

      // 날짜/시간 표시 초기화 및 업데이트
      updateDateTime();
      setInterval(updateDateTime, 1000); // 1초마다 업데이트

      // 오늘 날짜를 기본값으로 설정
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;

      // 순위별 옵션 동적 생성 (현재 날짜 기준, 지난/현재 기간만 표시)
      populateRankOptions();

      // 시트 정보 확인 (디버깅용)
      google.script.run.withSuccessHandler(function (info) {
        console.log("Sheet info:", info);
        if (info.success) {
          console.log("Available sheets:", info.sheetNames);
          // walk 또는 walk 시트가 있는지 확인
          const haswalk = info.sheetNames.some(function (name) {
            return name.toLowerCase() === 'walk';
          });
          if (!haswalk) {
            console.warn("walk 또는 walk 시트를 찾을 수 없습니다.");
            console.log("사용 가능한 시트:", info.sheetNames.join(", "));
          }
        } else {
          console.error("시트 정보 조회 실패:", info.error);
        }
      }).testGetSheetInfo();
    });

    // 학생 목록 미리 로드 (버퍼에 저장)
    function loadStudentList() {
      console.log("Loading student list...");
      google.script.run.withSuccessHandler(function (students) {
        studentListBuffer = students;
        console.log("Student list loaded: " + students.length + " students");
      }).withFailureHandler(function (error) {
        console.error("Failed to load student list:", error);
        studentListBuffer = [];
      }).getStudentList();
    }

    // 순위별 옵션 생성 (현재 날짜 기준, 조회 가능한 기간만 표시)
    function populateRankOptions() {
      const now = new Date();
      const year = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const currentDay = now.getDate();
      const todayStart = new Date(year, now.getMonth(), currentDay);
      todayStart.setHours(0, 0, 0, 0);

      // 월별: 현재 월까지
      const monthOg = document.getElementById('monthOptgroup');
      monthOg.innerHTML = '';
      for (let m = 1; m <= currentMonth; m++) {
        const opt = document.createElement('option');
        opt.value = 'month_' + m;
        opt.textContent = year + '년 ' + m + '월 1~10순위';
        monthOg.appendChild(opt);
      }

      // 분기: 현재 분기까지
      const quarterOg = document.getElementById('quarterOptgroup');
      quarterOg.innerHTML = '';
      const currentQuarter = Math.ceil(currentMonth / 3);
      const quarterLabels = ['', '1~3월', '4~6월', '7~9월', '10~12월'];
      for (let q = 1; q <= currentQuarter; q++) {
        const opt = document.createElement('option');
        opt.value = 'quarter_' + q;
        opt.textContent = year + '년 ' + quarterLabels[q] + ' 분기 1~10순위';
        quarterOg.appendChild(opt);
      }

      // 주별: 해당 주가 시작된 경우만 (주 시작일 <= 오늘)
      const weekOg = document.getElementById('weekOptgroup');
      weekOg.innerHTML = '';
      for (let m = 1; m <= 12; m++) {
        const lastDay = new Date(year, m, 0).getDate();
        for (let w = 1; w <= 5; w++) {
          const startDay = (w - 1) * 7 + 1;
          if (startDay > lastDay) break;
          const weekStart = new Date(year, m - 1, startDay);
          weekStart.setHours(0, 0, 0, 0);
          if (weekStart <= todayStart) {
            const opt = document.createElement('option');
            opt.value = 'week_' + year + '_' + m + '_' + w;
            opt.textContent = year + '년 ' + m + '월 ' + w + '주차 1~10순위';
            weekOg.appendChild(opt);
          }
        }
      }
    }

    // 담당자 목록 로드
    function loadManagerList() {
      google.script.run.withSuccessHandler(function (managers) {
        const select = document.getElementById('managerSelect');
        select.innerHTML = '<option value="전체">전체</option>';

        managers.forEach(function (manager) {
          const option = document.createElement('option');
          option.value = manager;
          option.textContent = manager;
          select.appendChild(option);
        });
      }).getManagerList();
    }

    // 이벤트 리스너 설정
    function setupEventListeners() {
      // 학생 검색 입력
      document.getElementById('studentSearch').addEventListener('input', function (e) {
        const keyword = e.target.value.trim();

        if (keyword.length === 0) {
          // 검색란을 지우면 선택된 학생 ID도 클리어
          selectedStudentId = "";
          document.getElementById('studentDropdown').style.display = 'none';
          return;
        }

        // 검색어가 변경되면 선택된 학생 ID 클리어 (새로운 검색 시작)
        // 단, 선택된 학생 형식(name + ' (' + id + ')')이 아닐 때만
        const currentValue = e.target.value;
        if (!currentValue.match(/\(.+\)$/)) {
          selectedStudentId = "";
        }

        // 디바운싱
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          searchStudents(keyword);
        }, 300);
      });

      // 조회 유형 변경
      document.getElementById('queryTypeSelect').addEventListener('change', function () {
        const type = this.value;
        document.getElementById('dateRangeGroup').style.display = type === '기간별' ? 'block' : 'none';
        document.getElementById('rankGroup').style.display = type === '순위별' ? 'block' : 'none';
      });

      // 외부 클릭 시 드롭다운 닫기
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.student-search-container')) {
          document.getElementById('studentDropdown').style.display = 'none';
        }
      });
    }

    // 학생 검색 (버퍼에서 검색)
    function searchStudents(keyword) {
      const dropdown = document.getElementById('studentDropdown');
      dropdown.innerHTML = '';

      // 버퍼가 아직 로드되지 않은 경우
      if (studentListBuffer.length === 0) {
        dropdown.innerHTML = '<div class="student-dropdown-item text-muted">학생 목록을 불러오는 중...</div>';
        dropdown.style.display = 'block';

        // 버퍼 로드 후 다시 검색
        loadStudentList();
        setTimeout(function () {
          if (studentListBuffer.length > 0) {
            searchStudents(keyword);
          }
        }, 500);
        return;
      }

      const searchKeyword = keyword.toLowerCase().trim();
      const results = [];

      // 버퍼에서 검색
      for (let i = 0; i < studentListBuffer.length; i++) {
        const student = studentListBuffer[i];
        if (
          (student.id && student.id.toString().toLowerCase().includes(searchKeyword)) ||
          (student.name && student.name.toLowerCase().includes(searchKeyword))
        ) {
          results.push(student);
        }
      }

      if (results.length === 0) {
        dropdown.innerHTML = '<div class="student-dropdown-item text-muted">검색 결과가 없습니다.</div>';
        dropdown.style.display = 'block';
        return;
      }

      results.forEach(function (student) {
        const item = document.createElement('div');
        item.className = 'student-dropdown-item';

        // 중복 건수가 1보다 크면 작은 빨간색 숫자로 표시
        const countDisplay = (student.count && student.count > 1)
          ? `<span class="student-count-badge">(${student.count})</span>`
          : '';

        item.innerHTML = `<strong>${student.id}</strong> - ${student.name}${countDisplay}`;
        item.onmouseenter = function () {
          // 마우스 오버 시 입력 필드에 미리 표시
          document.getElementById('studentSearch').value = student.name + ' (' + student.id + ')';
        };
        item.onclick = function () {
          selectStudent(student.id, student.name);
        };
        dropdown.appendChild(item);
      });

      dropdown.style.display = 'block';
    }

    // 학생 선택
    function selectStudent(id, name) {
      selectedStudentId = id;
      document.getElementById('studentSearch').value = name + ' (' + id + ')';
      document.getElementById('studentDropdown').style.display = 'none';
    }

    // 데이터 조회
    // 데이터 조회 (수정됨)
    function searchData() {
      // [1] 변수 선언 (여기서 한 번만 선언합니다)
      const queryType = document.getElementById('queryTypeSelect').value;

      // [2] '순위별' 조회일 때만 검색 조건 초기화
      if (queryType === '순위별') {
        // 학생 검색 초기화
        document.getElementById('studentSearch').value = '';
        selectedStudentId = ""; // 내부 변수도 초기화

        // 담당자 선택 초기화 ('전체'로 변경)
        document.getElementById('managerSelect').value = '전체';
      }

      // [3] 검색란의 값 확인 - 비어있거나 선택된 학생 형식이 아니면 클리어
      const searchValue = document.getElementById('studentSearch').value.trim();
      if (searchValue === "" || !searchValue.match(/\(.+\)$/)) {
        selectedStudentId = "";
      }

      // [4] 필터 객체 생성 (위에서 선언한 queryType 변수 사용)
      const filters = {
        studentId: selectedStudentId,
        manager: document.getElementById('managerSelect').value,
        dateType: queryType, // 여기서 재선언 없이 사용
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        rankCondition: document.getElementById('rankConditionSelect').value
      };

      // 기간별 조회 시 날짜 확인
      if (queryType === '기간별') {
        if (!filters.startDate || !filters.endDate) {
          alert('시작일과 종료일을 선택해주세요.');
          return;
        }
        if (new Date(filters.startDate) > new Date(filters.endDate)) {
          alert('시작일이 종료일보다 늦을 수 없습니다.');
          return;
        }
      }

      // 로딩 표시
      const resultSection = document.getElementById('resultSection');
      resultSection.style.display = 'block';
      document.getElementById('resultCount').textContent = '조회 중...';
      document.getElementById('resultTableBody').innerHTML = '<tr><td colspan="8" class="text-center">조회 중입니다...</td></tr>';

      const apiMethod = queryType === '순위별' ? 'queryRankData' : 'querywalkData';

      google.script.run
        .withSuccessHandler(function (result) {
          if (result === null || result === undefined) {
            console.error("Result is null or undefined");
            google.script.run.withSuccessHandler(function (testResult) {
              if (testResult && testResult.success) {
                alert('데이터 조회는 가능하지만 필터링 중 문제가 발생했습니다.\n\n데이터 건수: ' + testResult.count + '\n\nGoogle Apps Script 실행 로그를 확인해주세요.');
              } else {
                alert('조회 결과를 받을 수 없습니다.\n\n시트 이름이 "walk" 또는 "walk"인지 확인해주세요.\n\n에러: ' + (testResult ? testResult.error : '알 수 없는 오류'));
              }
            }).testGetData();
            document.getElementById('resultCount').textContent = '조회 실패';
            document.getElementById('resultTableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">조회 결과를 받을 수 없습니다.<br>시트 이름을 확인해주세요.</td></tr>';
            return;
          }
          if (result.error) {
            alert('조회 중 오류가 발생했습니다: ' + result.error);
            document.getElementById('resultCount').textContent = '조회 실패';
            document.getElementById('resultTableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">조회 중 오류가 발생했습니다.</td></tr>';
            return;
          }
          displayResults(result);
          loadAndDrawCharts(filters);
        })
        .withFailureHandler(function (error) {
          console.error("Query failed:", error);
          alert('조회 실패: ' + (error.message || error.toString()) + '\n\nGoogle Apps Script 실행 로그를 확인해주세요.');
          document.getElementById('resultCount').textContent = '조회 실패';
          document.getElementById('resultTableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">조회 중 오류가 발생했습니다.<br>콘솔을 확인해주세요.</td></tr>';
        })[apiMethod](filters);
    }

    // 결과 표시
    function displayResults(result) {
      if (!result) {
        document.getElementById('resultCount').textContent = '조회 실패';
        document.getElementById('resultTableBody').innerHTML = '<tr><td colspan="8" class="text-center text-danger">조회 결과를 받을 수 없습니다.</td></tr>';
        return;
      }

      const resultSection = document.getElementById('resultSection');
      const countBadge = document.getElementById('resultCount');
      const tableBody = document.getElementById('resultTableBody');
      const tableHead = document.getElementById('resultTableHead');

      // 순위별 결과 (순위, 학번, 반, 구분, 이름, 기숙사, 퀀텀, 건수)
      if (result.isRank) {
        tableHead.innerHTML = '<th>순위</th><th>학번</th><th>반</th><th>구분</th><th>이름</th><th>기숙사</th><th>퀀텀</th><th>건수</th>';
        countBadge.innerHTML = (result.rankLabel ? result.rankLabel : '순위 조회') + ' <span style="font-size:0.85em;opacity:0.9;">(상위 주의 대상)</span>';
        tableBody.innerHTML = '';

        if (!result.rankData || result.rankData.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">조회 결과가 없습니다.</td></tr>';
        } else {
          result.rankData.forEach(function (row) {
            const rank = row[0];
            const tr = document.createElement('tr');
            const rowClass = rank <= 3 ? 'rank-row-' + rank : '';
            const cellClass = rank <= 3 ? ' rank-cell-' + rank : '';
            tr.className = rowClass;
            tr.innerHTML = `
                            <td class="${cellClass}"><strong>${rank}위</strong></td>
                            <td>${row[1] || ''}</td>
                            <td>${row[2] || ''}</td>
                            <td>${row[3] || ''}</td>
                            <td>${row[4] || ''}</td>
                            <td>${row[5] || ''}</td>
                            <td>${row[6] || ''}</td>
                            <td><span class="demerit-count">${row[7] || 0}건</span></td>
                        `;
            tableBody.appendChild(tr);
          });
        }
        resultSection.style.display = 'block';
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      // 일반 조회 결과 (기숙사, 퀀텀 컬럼 포함)
      tableHead.innerHTML = '<th>학번</th><th>반</th><th>구분</th><th>이름</th><th>기숙사</th><th>퀀텀</th><th>walk 시간</th><th>담당자</th>';
      const count = result.count || 0;
      countBadge.textContent = `총 ${count.toLocaleString()} 건`;
      tableBody.innerHTML = '';

      if (!result.data || result.data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">조회 결과가 없습니다.</td></tr>';
        resultSection.style.display = 'block';
        return;
      }

      result.data.forEach(function (row) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
                    <td>${row[0] || ''}</td>
                    <td>${row[1] || ''}</td>
                    <td>${row[2] || ''}</td>
                    <td>${row[3] || ''}</td>
                    <td>${row[6] || ''}</td>
                    <td>${row[7] || ''}</td>
                    <td>${formatDateTime(row[4])}</td>
                    <td>${row[5] || ''}</td>
                `;
        tableBody.appendChild(tr);
      });

      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function loadAndDrawCharts(filters) {
      document.getElementById('chartSection').style.display = 'block';
      google.script.run
        .withSuccessHandler(drawCharts)
        .withFailureHandler(function () {
          document.getElementById('chartSection').style.display = 'none';
        })
        .getChartData(filters);
    }

    function drawCharts(chartData) {
      if (!chartData) chartData = { barData: [], lineData: [] };

      if (barChartInstance) {
        barChartInstance.destroy();
        barChartInstance = null;
      }
      if (lineChartInstance) {
        lineChartInstance.destroy();
        lineChartInstance = null;
      }

      const barCtx = document.getElementById('barChart');
      const lineCtx = document.getElementById('lineChart');
      if (!barCtx || !lineCtx) return;

      const barLabels = (chartData.barData || []).map(function (d) { return d.label; });
      const barValues = (chartData.barData || []).map(function (d) { return d.value; });
      const lineLabels = (chartData.lineData || []).map(function (d) { return d.date; });
      const lineValues = (chartData.lineData || []).map(function (d) { return d.count; });

      if (barLabels.length > 0) {
        barChartInstance = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: barLabels,
            datasets: [{
              label: '건수',
              data: barValues,
              backgroundColor: 'rgba(69, 90, 100, 0.7)',
              borderColor: 'rgb(55, 71, 79)',
              borderWidth: 1
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { display: false }
            },
            scales: {
              x: {
                beginAtZero: true,
                title: { display: true, text: '건수' }
              },
              y: {
                ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: false }
              }
            }
          }
        });
      }

      if (lineLabels.length > 0) {
        lineChartInstance = new Chart(lineCtx, {
          type: 'line',
          data: {
            labels: lineLabels,
            datasets: [{
              label: '일별 건수',
              data: lineValues,
              borderColor: 'rgb(183, 28, 28)',
              backgroundColor: 'rgba(183, 28, 28, 0.1)',
              fill: true,
              tension: 0.2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: '건수' }
              }
            }
          }
        });
      }

      if (barLabels.length === 0 && lineLabels.length === 0) {
        document.getElementById('chartSection').style.display = 'none';
      }
    }

    // 날짜시간 포맷팅
    function formatDateTime(dateTimeValue) {
      if (!dateTimeValue) return '';

      let date;
      if (dateTimeValue instanceof Date) {
        date = new Date(dateTimeValue);
      } else if (typeof dateTimeValue === 'string') {
        date = new Date(dateTimeValue.replace(' ', 'T'));
      } else {
        date = new Date(dateTimeValue);
      }

      if (isNaN(date.getTime())) return dateTimeValue.toString();

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');

      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }
  </script>
